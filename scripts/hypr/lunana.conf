# lunana.conf — iNiR-owned Hyprland surface styling, sourced from Omarchy's config.
#
# Installed by `lunana-suite install` (sourced from hyprland.conf via a
# `source = ~/.config/hypr/lunana.conf` line inside the lunana block) and
# removed by `lunana-suite uninstall`. Coexists with Omarchy's own config;
# Omarchy's animation/border settings stay authoritative — this file only adds
# blur + shadow layerrules for lunana layer namespaces.
#
# `place-within-backdrop` has no Hyprland analog and is dropped: the background
# layer renders below windows by default.

layerrule = blur, lunana-background
layerrule = blur, lunana-bar
layerrule = noanim, lunana-background

layerrule = blur, lunana-sidebar-left
layerrule = blur, lunana-sidebar-right
layerrule = shadows, lunana-sidebar-left
layerrule = shadows, lunana-sidebar-right

layerrule = blur, lunana-overview
layerrule = shadows, lunana-overview

layerrule = blur, lunana-control-center
layerrule = shadows, lunana-control-center

layerrule = blur, lunana-cheatsheet
layerrule = blur, lunana-session
layerrule = blur, lunana-wallpaper
layerrule = blur, lunana-region
layerrule = blur, lunana-altswitcher

layerrule = blur, lunana-iris
layerrule = ignorealpha 0.1, lunana-iris

layerrule = blur, lunana-waffle-start
layerrule = blur, lunana-waffle-action
layerrule = blur, lunana-waffle-notifications
layerrule = shadows, lunana-waffle-start
