# lunana.conf — iNiR-owned Hyprland surface styling, sourced from the config.
#
# Installed by `lunana-suite install` (sourced from hyprland.conf via an
# absolute `source = ...` line) and removed by `lunana-suite uninstall`.
# Coexists with Omarchy's own config — this file only adds blur layer rules
# for lunana surfaces.
#
# Syntax is Hyprland ≥0.53 (`layerrule = <effects>, match:namespace <re>`);
# verified live with `hyprctl keyword layerrule`. Vendored iNiR surfaces keep
# their own `quickshell:*` namespaces, so one regex covers them all; the
# lunana host-provided shells are listed explicitly. There is no shadow layer
# rule — shadow comes from decoration settings, which stay Omarchy's.
# `place-within-backdrop` has no Hyprland analog and is dropped: the
# background layer renders below windows by default.

# Every vendored iNiR surface (bar, overview, sidebars, etc.)
layerrule = blur on, match:namespace quickshell:.*

# Lunana host-provided overlay shells
layerrule = blur on, match:namespace lunana-sidebar-left
layerrule = blur on, match:namespace lunana-sidebar-right
layerrule = blur on, match:namespace lunana-iris
layerrule = blur on, match:namespace lunana-iris-palette
layerrule = blur on, match:namespace lunana-iris-control
layerrule = blur on, match:namespace lunana-iris-stage
layerrule = blur on, match:namespace lunana-iris-edit
